- id: SICKPAY-ELIG-001
  name: "Wynagrodzenie chorobowe przysługuje pracownikowi"
  description: "Za czas niezdolności do pracy wskutek choroby pracownik zachowuje prawo do wynagrodzenia od pracodawcy — łącznie do 33 dni w roku kalendarzowym (14 dni po roku, w którym ukończył 50 lat)."
  category: EMPLOYER_SICK_PAY
  rule_type: ELIGIBILITY
  legal_basis: {document: KP, article: "92", paragraph: "1", point: "1"}
  source_document: KP
  source_location: "art. 92 § 1 pkt 1, § 5"
  source_excerpt: "trwającej łącznie do 33 dni w ciągu roku kalendarzowego, a w przypadku pracownika, który ukończył 50 rok życia - ... do 14 dni"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_is_employee_on, args: {date: incapacity.start_date}, operator: eq, value: true}
      - {fact: f_sick_pay_days_remaining_in_year, operator: gt, value: 0}
      - {fact: f_sickness_benefit_right_exists, operator: eq, value: true}
  result: {status: ELIGIBLE, set: {benefit: EMPLOYER_SICK_PAY, funded_by: EMPLOYER}}
  exceptions: [SICKPAY-EXCL-001]
  dependencies: [SICK-ELIG-001, SICK-ELIG-002, SICK-ELIG-003]
  overrides: []
  required_inputs: [person.birth_date, incapacity.start_date, benefit_history.employer_sick_pay_days_in_year, insurance.titles]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Limit roczny: f_sick_pay_day_limit (33 albo 14 wg KP 92 § 5 — próg 50 lat stosuje się do niezdolności PO roku, w którym pracownik ukończył 50 lat). Liczy się łącznie u danego pracodawcy? — przepis mówi 'w ciągu roku kalendarzowego', patrz GAP-008."

- id: SICKPAY-RATE-001
  name: "Wynagrodzenie chorobowe 80%"
  description: "Wynagrodzenie chorobowe wynosi 80% wynagrodzenia, chyba że przepisy u pracodawcy przewidują więcej."
  category: EMPLOYER_SICK_PAY
  rule_type: RATE
  legal_basis: {document: KP, article: "92", paragraph: "1", point: "1"}
  source_document: KP
  source_location: "art. 92 § 1 pkt 1"
  source_excerpt: "pracownik zachowuje prawo do 80% wynagrodzenia, chyba że obowiązujące u danego pracodawcy przepisy prawa pracy przewidują wyższe"
  valid_from: null
  valid_to: null
  conditions: {all: [{field: benefit, operator: eq, value: EMPLOYER_SICK_PAY}]}
  result: {set: {rate: {param: SICK_PAY_RATE_STD}}}
  exceptions: [SICKPAY-RATE-002]
  dependencies: [SICKPAY-ELIG-001]
  overrides: []
  required_inputs: []
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Wyższa stawka z regulaminu pracodawcy — pole opcjonalne employment.employer_sick_pay_rate_override."

- id: SICKPAY-RATE-002
  name: "Wynagrodzenie chorobowe 100% w ciąży"
  description: "Za niezdolność przypadającą w czasie ciąży (oraz wypadek w drodze do/z pracy, dawstwo) pracownik zachowuje 100% wynagrodzenia."
  category: EMPLOYER_SICK_PAY
  rule_type: RATE
  legal_basis: {document: KP, article: "92", paragraph: "1", point: "2-3"}
