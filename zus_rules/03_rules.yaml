rules:
# =====================================================================
# GEN — reguły ogólne (płatnik, zadłużenie, przedawnienie)
# =====================================================================
- id: GEN-CLS-001
  name: "Płatnik zasiłku — płatnik składek (>20 ubezpieczonych)"
  description: "Zasiłki ustala i wypłaca płatnik składek, który zgłasza do ubezpieczenia chorobowego więcej niż 20 ubezpieczonych (stan na 30 listopada poprzedniego roku), chyba że świadczenie przysługuje po ustaniu ubezpieczenia."
  category: GENERAL
  rule_type: CLASSIFICATION
  legal_basis: {document: USTAWA, article: "61", paragraph: "1-2", point: "1"}
  source_document: USTAWA
  source_location: "art. 61 ust. 1 pkt 1, ust. 2"
  source_excerpt: "płatnicy składek na ubezpieczenie chorobowe, którzy zgłaszają do ubezpieczenia chorobowego powyżej 20 ubezpieczonych"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_is_employer_payer_title, operator: eq, value: true}
      - {field: payer.insured_count_on_nov30_prev_year, operator: gt, value: {param: PAYER_INSURED_THRESHOLD}}
      - {fact: f_benefit_after_title_end, operator: eq, value: false}
  result: {set: {payer_of_benefit: CONTRIBUTION_PAYER}}
  exceptions: [GEN-CLS-002]
  dependencies: []
  overrides: []
  required_inputs: [payer.insured_count_on_nov30_prev_year, insurance.titles]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "f_is_employer_payer_title = tytuł inny niż pozarolnicza działalność/współpraca/duchowny/pracodawca zagraniczny (art. 61 ust. 1 pkt 2 lit. b, c, e)."

- id: GEN-CLS-002
  name: "Płatnik zasiłku — ZUS"
  description: "ZUS ustala i wypłaca zasiłki gdy płatnik zgłasza ≤20 ubezpieczonych, dla prowadzących pozarolniczą działalność i współpracujących, duchownych, po ustaniu ubezpieczenia oraz przy pracodawcy zagranicznym."
  category: GENERAL
  rule_type: CLASSIFICATION
  legal_basis: {document: USTAWA, article: "61", paragraph: "1", point: "2"}
  source_document: USTAWA
  source_location: "art. 61 ust. 1 pkt 2 lit. a-e"
  source_excerpt: "Zakład Ubezpieczeń Społecznych: a) ubezpieczonym, których płatnicy składek zgłaszają ... nie więcej niż 20 ubezpieczonych"
  valid_from: null
  valid_to: null
  conditions:
    any:
      - {field: payer.insured_count_on_nov30_prev_year, operator: lte, value: {param: PAYER_INSURED_THRESHOLD}}
      - {fact: f_primary_title_type, operator: in, value: [SELF_EMPLOYED, SELF_EMPLOYED_COLLABORATOR, CLERGY, FOREIGN_EMPLOYER]}
      - {fact: f_benefit_after_title_end, operator: eq, value: true}
  result: {set: {payer_of_benefit: ZUS}}
  exceptions: []
  dependencies: []
  overrides: [GEN-CLS-001]
  required_inputs: [payer.insured_count_on_nov30_prev_year, insurance.titles]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Art. 61 ust. 4 (kontynuacja wypłaty przez ZUS po 31.12) — poza MVP."

- id: GEN-EXCL-001
  name: "Zadłużenie składkowe >1% minimalnego wynagrodzenia (osoby z art. 2a)"
  description: "Zasiłek chorobowy, świadczenie rehabilitacyjne, macierzyński i opiekuńczy nie przysługują prowadzącym pozarolniczą działalność, współpracującym, duchownym-płatnikom i marynarzom, jeżeli w dniu powstania prawa zadłużenie składkowe przekracza 1% minimalnego wynagrodzenia — do czasu spłaty całości."
  category: GENERAL
  rule_type: EXCLUSION
  legal_basis: {document: USTAWA, article: "2a", paragraph: "1", point: null}
  source_document: USTAWA
  source_location: "art. 2a ust. 1"
  source_excerpt: "w razie wystąpienia w dniu powstania prawa do świadczenia zadłużenia ... na kwotę przekraczającą 1 % minimalnego wynagrodzenia ... do czasu spłaty całości zadłużenia"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_primary_title_type, operator: in, value: [SELF_EMPLOYED, SELF_EMPLOYED_COLLABORATOR, CLERGY_SELF_PAYER, SEAFARER_ART6_24]}
      - {fact: f_debt_on_right_date_exceeds_threshold, operator: eq, value: true}
      - {fact: f_debt_fully_repaid, operator: eq, value: false}
  result: {status: NOT_ELIGIBLE, reason_code: CONTRIBUTION_DEBT, set: {suspended_until_debt_repaid: true}}
  exceptions: [GEN-EXCL-002]
  dependencies: []
  overrides: []
  required_inputs: [debt.amount_on_right_date, debt.repaid_in_full_date, insurance.titles]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Dotyczy świadczeń z art. 2 pkt 1, 2, 5, 6. Próg = MIN_WAGE × 1% (płaca minimalna 4806,00 zł — potwierdzona, M07). Po spłacie: wypłata w 60 dni (GEN-DL-002). Status 'NOT_ELIGIBLE' z flagą zawieszenia — UI musi pokazać, że po spłacie prawo odżywa."

- id: GEN-EXCL-002
  name: "Przedawnienie prawa przy niespłaceniu zadłużenia w 6 miesięcy"
  description: "Prawo do świadczeń z art. 2a przedawnia się, jeśli zadłużenie nie zostanie uregulowane w ciągu 6 miesięcy od dnia powstania prawa."
  category: GENERAL
  rule_type: EXCLUSION
  legal_basis: {document: USTAWA, article: "2a", paragraph: "2", point: null}
  source_document: USTAWA
  source_location: "art. 2a ust. 2"
  source_excerpt: "przedawnia się, jeżeli zadłużenie ... nie zostanie uregulowane w ciągu 6 miesięcy od dnia powstania prawa do świadczenia"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_debt_on_right_date_exceeds_threshold, operator: eq, value: true}
