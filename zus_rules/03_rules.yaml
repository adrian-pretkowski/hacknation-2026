  legal_basis: {document: USTAWA, article: "30", paragraph: "3", point: null}
  source_document: USTAWA
  source_location: "art. 30 ust. 3; KP art. 177 § 4; treść zadania (CONF-001, M16 a)"
  source_excerpt: "przysługuje do dnia porodu zasiłek w wysokości zasiłku macierzyńskiego"
  valid_from: null
