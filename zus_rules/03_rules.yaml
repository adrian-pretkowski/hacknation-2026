- id: SICK-ELIG-004
  name: "Doliczanie poprzednich okresów ubezpieczenia"
  description: "Do okresu wyczekiwania wlicza się poprzednie okresy ubezpieczenia chorobowego, jeśli przerwa nie przekroczyła 30 dni lub była spowodowana urlopem wychowawczym, bezpłatnym albo czynną służbą wojskową żołnierza niezawodowego."
  category: SICKNESS
  rule_type: CALCULATION
  legal_basis: {document: USTAWA, article: "4", paragraph: "2", point: null}
  source_document: USTAWA
  source_location: "art. 4 ust. 2"
  source_excerpt: "wlicza się poprzednie okresy ubezpieczenia chorobowego, jeżeli przerwa między nimi nie przekroczyła 30 dni lub była spowodowana urlopem wychowawczym, urlopem bezpłatnym"
  valid_from: null
  valid_to: null
  conditions: {all: [{field: insurance.titles, operator: exists, value: true}]}
  result: {compute: f_continuous_sickness_insurance_days, output: facts.continuous_sickness_insurance_days}
  exceptions: []
  dependencies: []
  overrides: []
  required_inputs: [insurance.titles]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Przerwa = liczba dni kalendarzowych między dniem ustania a dniem ponownego objęcia, bez obu tych dni (DERIVED, GAP-004)."

- id: SICK-ELIG-005
  name: "Zasiłek od pierwszego dnia ubezpieczenia (wyjątki od okresu wyczekiwania)"
  description: "Bez okresu wyczekiwania — absolwenci objęci ubezpieczeniem w 90 dni od ukończenia szkoły/uczelni/szkoły doktorskiej; niezdolność wskutek wypadku w drodze do/z pracy; ubezpieczeni obowiązkowo z wcześniejszym ≥10-letnim okresem obowiązkowego ubezpieczenia (oraz posłowie/senatorowie, funkcjonariusze SC)."
  category: SICKNESS
  rule_type: EXCLUSION
  legal_basis: {document: USTAWA, article: "4", paragraph: "3", point: "1-5"}
  source_document: USTAWA
  source_location: "art. 4 ust. 3"
  source_excerpt: "Od pierwszego dnia ubezpieczenia chorobowego prawo do zasiłku chorobowego przysługuje: 1) absolwentom ..."
  valid_from: null
  valid_to: null
  conditions:
    any:
      - {fact: f_graduate_within_window, args: {days: {param: GRADUATE_WINDOW_DAYS}}, operator: eq, value: true}
      - {field: incapacity.cause, operator: eq, value: COMMUTE_ACCIDENT}
      - all:
          - {fact: f_sickness_insurance_mode_on, args: {date: incapacity.start_date}, operator: eq, value: MANDATORY}
          - {fact: f_prior_mandatory_sickness_insurance_years, operator: gte, value: {param: MANDATORY_HISTORY_YEARS}}
      - {field: person.special_status, operator: in, value: [MP_SENATOR_WITHIN_90_DAYS, CUSTOMS_SERVICE_KAS]}
  result: {set: {waiting_period_met: true, waiting_period_exemption: true}}
  exceptions: []
  dependencies: []
  overrides: [SICK-ELIG-002, SICK-ELIG-003]
  required_inputs: [person.graduation_date, incapacity.cause, insurance.titles]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P1
  automation_status: AUTOMATABLE
  notes: "Brak danych o ukończeniu szkoły przy niespełnionym okresie wyczekiwania → NEEDS_DATA (nie odmowa). 10 lat: f_prior_mandatory_sickness_insurance_years sumuje okresy obowiązkowe (DERIVED: 'wcześniejszy' = przed bieżącym tytułem)."

- id: SICK-ELIG-006
  name: "Zasiłek chorobowy po ustaniu tytułu ubezpieczenia"
  description: "Zasiłek przysługuje też, gdy niezdolność powstała po ustaniu tytułu, jeżeli trwała bez przerwy ≥30 dni i powstała ≤14 dni od ustania tytułu (≤3 miesiące przy chorobie zakaźnej / kod E)."
  category: SICKNESS
  rule_type: ELIGIBILITY
  legal_basis: {document: USTAWA, article: "7", paragraph: null, point: "1-2"}
