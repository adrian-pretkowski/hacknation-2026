  name: "Przejście z wynagrodzenia chorobowego na zasiłek chorobowy"
  description: "Po wyczerpaniu 33 (14) dni w roku kalendarzowym pracownikowi przysługuje zasiłek chorobowy; okresy wynagrodzenia chorobowego wlicza się do okresu zasiłkowego."
