- id: SICK-ELIG-001
  name: "Niezdolność do pracy powstała w czasie ubezpieczenia chorobowego"
  description: "Zasiłek chorobowy przysługuje ubezpieczonemu, który stał się niezdolny do pracy z powodu choroby w czasie trwania ubezpieczenia chorobowego."
  category: SICKNESS
  rule_type: ELIGIBILITY
  legal_basis: {document: USTAWA, article: "6", paragraph: "1", point: null}
  source_document: USTAWA
  source_location: "art. 6 ust. 1"
  source_excerpt: "przysługuje ubezpieczonemu, który stał się niezdolny do pracy z powodu choroby w czasie trwania ubezpieczenia chorobowego"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_sickness_insured_on, args: {date: incapacity.start_date}, operator: eq, value: true}
      - {field: incapacity.certificate_present, operator: eq, value: true}
  result: {set: {sickness_onset_basis: DURING_INSURANCE}}
  exceptions: [SICK-ELIG-006]
  dependencies: []
  overrides: []
  required_inputs: [insurance.titles, incapacity.start_date, incapacity.certificate_present]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Dowód niezdolności = zaświadczenie lekarskie e-ZLA (art. 53 ust. 1). Art. 6 ust. 2 (kwarantanna, leczenie odwykowe, dawstwo) — P2."

