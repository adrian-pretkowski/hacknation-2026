  category: SICKNESS
  rule_type: ELIGIBILITY
  legal_basis: {document: USTAWA, article: "4", paragraph: "1", point: "1"}
  source_document: USTAWA
  source_location: "art. 4 ust. 1 pkt 1"
  source_excerpt: "po upływie 30 dni nieprzerwanego ubezpieczenia chorobowego - jeżeli podlega obowiązkowo temu ubezpieczeniu"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_sickness_insurance_mode_on, args: {date: incapacity.start_date}, operator: eq, value: MANDATORY}
      - {fact: f_continuous_sickness_insurance_days, args: {as_of: incapacity.start_date}, operator: gte, value: {param: WAITING_DAYS_MANDATORY}}
  result: {set: {waiting_period_met: true}}
  exceptions: [SICK-ELIG-005]
  dependencies: [SICK-ELIG-004]
  overrides: []
  required_inputs: [insurance.titles, incapacity.start_date]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Niespełnienie (FALSE) i brak wyjątku SICK-ELIG-005 → NOT_ELIGIBLE za dni w okresie wyczekiwania; prawo powstaje od dnia następnego po upływie okresu (f_waiting_period_end_date). Dni te nie wliczają się do okresu zasiłkowego (SICK-DUR-004)."

- id: SICK-ELIG-003
  name: "Okres wyczekiwania 90 dni — ubezpieczenie dobrowolne"
  description: "Przy dobrowolnym ubezpieczeniu chorobowym (np. JDG, zlecenie) prawo do zasiłku powstaje po 90 dniach nieprzerwanego ubezpieczenia."
  category: SICKNESS
  rule_type: ELIGIBILITY
  legal_basis: {document: USTAWA, article: "4", paragraph: "1", point: "2"}
  source_document: USTAWA
  source_location: "art. 4 ust. 1 pkt 2"
  source_excerpt: "po upływie 90 dni nieprzerwanego ubezpieczenia chorobowego - jeżeli jest ubezpieczony dobrowolnie"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_sickness_insurance_mode_on, args: {date: incapacity.start_date}, operator: eq, value: VOLUNTARY}
      - {fact: f_continuous_sickness_insurance_days, args: {as_of: incapacity.start_date}, operator: gte, value: {param: WAITING_DAYS_VOLUNTARY}}
  result: {set: {waiting_period_met: true}}
  exceptions: [SICK-ELIG-005]
  dependencies: [SICK-ELIG-004]
