- id: MAT-CLS-002
  name: "Przedłużenie umowy terminowej do dnia porodu (KP 177 § 3)"
  description: "Umowa na czas określony lub na okres próbny >1 miesiąc, która rozwiązałaby się po upływie 3. miesiąca ciąży, ulega przedłużeniu do dnia porodu — nie dotyczy umowy na zastępstwo."
