  source_document: KP
  source_location: "art. 177 § 3, § 3(1)"
  source_excerpt: "która uległaby rozwiązaniu po upływie trzeciego miesiąca ciąży, ulega przedłużeniu do dnia porodu"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {field: employment.contract_type, operator: in, value: [FIXED_TERM, PROBATION_OVER_1_MONTH]}
      - {field: employment.is_replacement_contract, operator: eq, value: false}
      - {fact: f_contract_end_after_third_month_of_pregnancy, operator: eq, value: true}
  result: {set: {employment.extended_until_birth_kp177: true}}
  exceptions: []
  dependencies: []
  overrides: []
  required_inputs: [employment.contract_type, employment.contract_end_date, employment.is_replacement_contract, pregnancy.pregnancy_start_date]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: MEDIUM
  interpretation_status: DERIVED
  implementation_priority: P1
  automation_status: AUTOMATABLE
  notes: "Odblokowana po odpowiedzi mentora M13 (2026-11-21): miesiąc ciąży stwierdza lekarz — pregnancy.pregnancy_start_date z zaświadczenia lekarskiego; przedłużenie umowy potwierdza dokument (wymagany dokument od pracodawcy). Trzeci miesiąc = [początek + 2 mies., początek + 3 mies. − 1]; 'po upływie' ⇔ koniec umowy ≥ początek + 3 mies. (DERIVED, C3; przy krótszym miesiącu docelowym — ostatni dzień miesiąca, np. 30.11 + 3 mies. = 28.02, jak add_years). Brak daty początku ciąży lub końca umowy → NEEDS_DATA. GAP-007 zamknięty."

- id: MAT-ELIG-007
  name: "Zasiłek w wysokości zasiłku macierzyńskiego do dnia porodu"
  description: "Pracownicy, której umowa wygasła z powodu śmierci pracodawcy lub z którą rozwiązano umowę w ciąży z powodu upadłości lub likwidacji pracodawcy albo z naruszeniem przepisów prawa stwierdzonym przez sąd (treść zadania, M16 a) i nie zapewniono innego zatrudnienia, przysługuje do dnia poprzedzającego poród zasiłek w wysokości zasiłku macierzyńskiego (od dnia porodu — zasiłek macierzyński)."
