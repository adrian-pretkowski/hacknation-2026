- id: BASE-EMP-001
  name: "Podstawa pracownika — średnia z 12 miesięcy kalendarzowych"
  description: "Przeciętne miesięczne wynagrodzenie wypłacone za 12 miesięcy kalendarzowych poprzedzających miesiąc powstania niezdolności (dla macierzyńskiego — miesiąc powstania prawa), z wynagrodzenia u płatnika w okresie nieprzerwanego ubezpieczenia."
  category: BASE
  rule_type: CALCULATION
  legal_basis: {document: USTAWA, article: "36", paragraph: "1, 4", point: null}
  source_document: USTAWA
  source_location: "USTAWA art. 36 ust. 1, 4; art. 38 ust. 1; art. 47"
  source_excerpt: "przeciętne miesięczne wynagrodzenie wypłacone za okres 12 miesięcy kalendarzowych poprzedzających miesiąc, w którym powstała niezdolność do pracy"
  valid_from: null
  valid_to: null
  conditions: {all: [{fact: f_is_employee_title_for_base, operator: eq, value: true}, {fact: f_full_months_of_continuous_insurance, operator: gte, value: 12}]}
  result: {compute: f_benefit_base_employee, output: base.amount}
  exceptions: [BASE-EMP-002, BASE-EMP-003, BASE-EMP-008]
  dependencies: [BASE-EMP-004, BASE-EMP-005, BASE-EMP-006, BASE-EMP-007]
  overrides: []
  required_inputs: [income_history.months, base.reference_event_date]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "'Wynagrodzenie' = przychód po odliczeniu składek emerytalnej, rentowej i chorobowej potrąconych przez pracodawcę (art. 3 pkt 3) — pomniejszony zawsze o 13,71% (CONTRIBUTION_DEDUCTION_RATE) — ustalenie z mentorem M06 (2026-11-21), CONF-002 zamknięty; pola *_net = brutto × (1 − 0,1371). Dla macierzyńskiego 'miesiąc powstania niezdolności' → 'miesiąc powstania prawa' (art. 47 'odpowiednio', DERIVED)."

