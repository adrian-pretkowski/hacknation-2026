- id: REHAB-ELIG-001
  name: "Świadczenie rehabilitacyjne po wyczerpaniu zasiłku"
  description: "Przysługuje ubezpieczonemu, który po wyczerpaniu zasiłku chorobowego jest nadal niezdolny do pracy, a dalsze leczenie/rehabilitacja rokują odzyskanie zdolności — o czym orzeka lekarz orzecznik ZUS."
  category: REHABILITATION
  rule_type: ELIGIBILITY
  legal_basis: {document: USTAWA, article: "18", paragraph: "1, 3", point: null}
  source_document: USTAWA
  source_location: "art. 18 ust. 1, 3, 6"
  source_excerpt: "po wyczerpaniu zasiłku chorobowego jest nadal niezdolny do pracy, a dalsze leczenie lub rehabilitacja lecznicza rokują odzyskanie zdolności"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {fact: f_benefit_period_exhausted, operator: eq, value: true}
      - {field: rehabilitation.zus_medical_opinion_positive, operator: eq, value: true}
  result: {status: ELIGIBLE, set: {benefit: REHABILITATION_BENEFIT}}
  exceptions: [REHAB-EXCL-001]
  dependencies: [SICK-DUR-001, SICK-DUR-003]
  overrides: []
  required_inputs: [benefit_history.sickness_periods, rehabilitation.zus_medical_opinion_positive]
  missing_data_behavior: NEEDS_REVIEW
  evaluation: HUMAN_REVIEW
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P1
  automation_status: PARTIALLY_AUTOMATABLE
  notes: "Silnik może wskazać 'zbliża się wyczerpanie okresu zasiłkowego — rozważ wniosek', ale prawa nie przyznaje bez orzeczenia (pole zwykle UNKNOWN → NEEDS_REVIEW). Zakres MVP (M16 c, mentor fachowy 2026-11-21): tylko podstawa — prawo po wyczerpaniu 270 dni zasiłku chorobowego w ciąży; bez głębszej analizy (rokowanie, orzeczenie, kwota)."

