  source_excerpt: "przyjęła na wychowanie dziecko w wieku do 14 roku życia i wystąpiła do sądu opiekuńczego w sprawie jego przysposobienia"
  valid_from: null
  valid_to: null
  conditions:
    all:
      - {field: event.type, operator: eq, value: ADOPTION}
      - {field: event.court_adoption_application_date, operator: exists, value: true}
      - {fact: f_child_age_years_on, args: {date: event.date}, operator: lt, value: {param: ADOPTION_CHILD_AGE_MAX}}
      - any:
          - {fact: f_sickness_insured_on, args: {date: event.date}, operator: eq, value: true}
          - {fact: f_on_childcare_leave_on, args: {date: event.date}, operator: eq, value: true}
