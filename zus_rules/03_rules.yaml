  name: "Zasiłek macierzyński — rodzina zastępcza niezawodowa (dziecko do 7/10 lat)"
  description: "Przysługuje ubezpieczonemu, który przyjął na wychowanie w ramach rodziny zastępczej (z wyjątkiem zawodowej) dziecko do 7 roku życia, a przy odroczonym obowiązku szkolnym do 10."
