  valid_to: null
  conditions:
    any:
      - {field: person.has_pension_or_disability_pension, operator: eq, value: true}
      - {field: person.receives_unemployment_or_preretirement_benefit, operator: eq, value: true}
      - {field: person.on_health_restoration_leave, operator: eq, value: true}
  result: {status: NOT_ELIGIBLE, reason_code: REHAB_EXCLUSION}
