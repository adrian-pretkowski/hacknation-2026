      - {field: employment.other_employment_provided, operator: eq, value: false}
  result: {status: ELIGIBLE, set: {benefit: MATERNITY_EQUIVALENT_ALLOWANCE, period_end: DAY_BEFORE_BIRTH, rate: {param: MAT_RATE_FULL}, payer_of_benefit: ZUS}}
  exceptions: [GEN-EXCL-001]
  dependencies: []
  overrides: []
  required_inputs: [insurance.titles, pregnancy.pregnancy_start_date, employment.other_employment_provided]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: MEDIUM
  interpretation_status: DERIVED
  implementation_priority: P1
  automation_status: AUTOMATABLE
  notes: "CONF-001 rozstrzygnięty przez mentora fachowego ZUS (M16 a, 2026-11-21): stosujemy treść zadania — zasiłek przysługuje także po rozwiązaniu umowy w ciąży z naruszeniem przepisów prawa stwierdzonym przez sąd (UNLAWFUL_TERMINATION_COURT_CONFIRMED); wyciąg ustawy w materiałach wymienia tylko śmierć/upadłość/likwidację. Postępowanie w toku (UNLAWFUL_TERMINATION_PENDING) — prawo nie jest jeszcze stwierdzone. Stawka 100% — DERIVED z 'w wysokości zasiłku macierzyńskiego' i art. 31 ust. 1. 'Do dnia porodu' = do dnia poprzedzającego poród (M15 e, mentor fachowy 2026-11-21)."

