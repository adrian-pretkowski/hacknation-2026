  name: "Wyłączenia świadczenia rehabilitacyjnego"
  description: "Nie przysługuje osobie uprawnionej do emerytury/renty, zasiłku dla bezrobotnych, przedemerytalnego, rodzicielskiego świadczenia uzupełniającego, nauczycielskiego świadczenia kompensacyjnego, urlopu dla poratowania zdrowia."
