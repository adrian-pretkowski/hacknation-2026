  result: {set: {sickness_onset_basis: AFTER_TITLE_END}}
  exceptions: [SICK-EXCL-003, SICK-EXCL-004]
  dependencies: []
  overrides: []
  required_inputs: [insurance.titles, incapacity.start_date, incapacity.end_date, incapacity.codes]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P1
  automation_status: AUTOMATABLE
  notes: "operator 'in' na liście kodów = 'lista zawiera'. Płatnik po ustaniu = ZUS (GEN-CLS-002). Dokument: oświadczenie z zał. 4 ROZP_DOK (SICK-DOC-003)."

- id: SICK-EXCL-001
  name: "Brak zasiłku za okres zachowania prawa do wynagrodzenia"
  description: "Zasiłek nie przysługuje za okresy, w których ubezpieczony zachowuje prawo do wynagrodzenia (np. wynagrodzenie chorobowe); okresy te wlicza się do okresu zasiłkowego."
