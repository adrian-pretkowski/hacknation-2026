  valid_from: null
  valid_to: null
  conditions:
    all:
      - {field: benefit, operator: eq, value: EMPLOYER_SICK_PAY}
      - any:
          - {fact: f_incapacity_in_pregnancy, operator: eq, value: true}
          - {field: incapacity.cause, operator: in, value: [COMMUTE_ACCIDENT, ORGAN_DONOR]}
  result: {set: {rate: {param: SICK_PAY_RATE_PREGNANCY}}}
  exceptions: []
  dependencies: [SICKPAY-ELIG-001]
  overrides: [SICKPAY-RATE-001]
  required_inputs: [incapacity.codes, pregnancy.is_pregnant_during_incapacity, incapacity.cause]
  missing_data_behavior: NEEDS_DATA
  evaluation: ACTIVE
  confidence: HIGH
  interpretation_status: DIRECT
  implementation_priority: P0
  automation_status: AUTOMATABLE
  notes: "Kod B może zostać pominięty na wniosek ubezpieczonej (USTAWA art. 57 ust. 2) — brak kodu B ≠ brak ciąży → UNKNOWN, jeśli pregnancy.* nie podano."

