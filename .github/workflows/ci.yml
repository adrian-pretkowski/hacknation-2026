name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # wywoływany z deploy.yml przed wdrożeniem (INT-11)

# Nowy push/PR anuluje trwający przebieg tej samej gałęzi
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Audyt reguł
        run: python zus_rules/tools/build_catalog.py
      - name: Ruff
        working-directory: backend
        run: python -m ruff check .
      - name: Pytest (slice + kontrakt + audyt)
        working-directory: backend
        run: python -m pytest -p no:warnings
      - name: Testy skryptów (claim_task)
        run: python -m pytest scripts/tests -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typy z kontraktu są aktualne
        run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start serwerów
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &)
          (cd frontend && nohup npm run start -- --port 3000 > ../frontend.log 2>&1 &)
      - name: Smoke
        run: python scripts/smoke.py --wait 60
      - name: Logi serwerów (przy błędzie)
        if: failure()
        run: tail -n 50 backend.log frontend.log

  e2e:
    needs: smoke
    runs-on: ubuntu-latest
    # WYŁĄCZONY (INT-12) do czasu stabilizacji scenariuszy na runnerze; włączenie: usuń `if: false`.
    if: false
    continue-on-error: true
    env:
      CI: "true"
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Start serwerów
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &)
          (cd frontend && nohup npm run start -- --port 3000 > ../frontend.log 2>&1 &)
          python scripts/smoke.py --wait 60
      - name: Scenariusze E2E (telefon + komputer)
        run: npm test
        working-directory: e2e
      - name: Raport Playwright (przy błędzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
