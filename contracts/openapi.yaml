# contracts/openapi.yaml - kontrakt BE/FE. Właściciel: INT. Zmiany przez PR (akceptacja BE + FE). Po zmianie: cd frontend; npm run gen:api
openapi: 3.1.0
info:
  title: Przewodnik Przyszłego Rodzica - API
  version: 1.0.0
  description: 'Kontrakt v1. Właściciel: Integrator (INT). Zmiany tylko przez PR z akceptacją BE i FE; wyłącznie addytywne w ramach
    v1.

    Modele danych: zus_rules/04_INPUT_DATA_SCHEMA.json (In*) i 05_OUTPUT_DATA_SCHEMA.json (Out*) - przeniesione do components.

    Status operacji: `x-status: implemented` (działa, sprawdzane testem kontraktu) albo `planned` (zadeklarowane, zadanie w `x-task`).

    Endpointy `/api/sim/*` są WYŁĄCZNIE symulacjami (każda odpowiedź ma `simulated: true`) - wymóg zadania.

    Kwoty: string dziesiętny (dokładny Decimal, bez zaokrągleń - GAP-001). Daty: ISO 8601. Błędy: application/problem+json.'
servers:
- url: http://localhost:8000
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Stan usługi i wersja zestawu reguł
      responses:
        '200':
          description: Usługa działa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                ruleset_version: 0.1.0
                law_reference_date: '2026-11-21'
                engine: slice-v0
                app_version: dev
      x-status: implemented
      x-owner: INT
  /api/evaluate:
    post:
      operationId: evaluate
      summary: Ocena uprawnień i wyliczenie świadczeń dla sytuacji użytkownika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            examples:
              employee_mother_815:
                summary: Pracownica, 1 dziecko, wniosek 81,5% w terminie (dane syntetyczne)
                value:
                  evaluation:
                    as_of_date: '2027-04-05'
                  person:
                    role: MOTHER
                  insurance:
                    titles:
                    - title_type: EMPLOYMENT_CONTRACT
                      sickness_insurance_mode: MANDATORY
                      from: '2022-02-01'
                      to: null
                  event:
                    type: BIRTH
                    date: '2027-03-15'
                  children:
                    count_at_birth: 1
                  income_history:
                    manual_base_override: '6000.00'
                  applications:
                    combined_815_filed_date: '2027-04-05'
      responses:
        '200':
          description: Wynik ewaluacji (także NEEDS_DATA / NEEDS_REVIEW - to nie są błędy HTTP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
              examples:
                eligible_815:
                  value:
                    evaluation_id: 3f1c2b9e-0000-4000-8000-000000000001
                    ruleset_version: 0.1.0
                    law_reference_date: '2026-11-21'
                    engine: slice-v0
                    overall_status: ELIGIBLE
                    benefits:
                    - benefit_type: MATERNITY_BENEFIT
                      leave_type: MATERNITY_LEAVE
                      status: ELIGIBLE
                      rate: '0.815'
                      period:
                        from: '2027-03-15'
                        to: '2027-08-01'
                        max_weeks: 20
                      days: 140
                      daily_amount_exact: '163'
                      total_amount_exact: '22820'
                      payer_of_benefit: null
                      reasons:
                      - code: RATE_COMBINED_815
                        rule_id: RATE-MAT-003
                        message: Wniosek o łączny zasiłek złożony w 21 dni od porodu - 81,5% podstawy.
                        legal_basis:
                        - document: USTAWA
                          location: art. 31 ust. 3; art. 30a ust. 1
                      applied_rules:
                      - MAT-ELIG-001
                      - MAT-DUR-001
                      - MAT-DUR-009
                      - APP-DL-001
                      - RATE-MAT-003
                      - CALC-MAT-001
                    missing_data: []
                    assumptions:
                    - code: ROUNDING_UNCONFIRMED
                      text: Kwoty bez zaokrągleń - zasady zaokrąglania ZUS niepotwierdzone (GAP-001).
                    not_evaluated_rules:
                    - MAT-ELIG-004
                    - MAT-ELIG-005
                    - MAT-ELIG-006
                    - BASE-EMP-001
        '422':
          description: Niepoprawny format żądania
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Niepoprawne dane wejściowe
                status: 422
                detail: Żądanie nie spełnia kontraktu.
                errors:
                - field: event.date
                  code: date_from_datetime_parsing
                  message: Input should be a valid date
      x-status: implemented
      x-owner: BE-1
  /api/cases:
    get:
      operationId: listCases
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-06
      summary: Lista przykładowych spraw do wyboru (syntetyczne; ZUS_SAMPLE po zgodzie M02)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseList'
              example:
                items:
                - case_id: synthetic-employee-mother
                  title: Pracownica, 1 dziecko, wniosek 81,5%
                  event_type: BIRTH
                  source: SYNTHETIC
                  has_expected: true
  /api/cases/{case_id}:
    get:
      operationId: getCase
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-06
      summary: 'Szczegóły sprawy: dane wejściowe i oczekiwany wynik'
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          description: Brak sprawy
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/cases/{case_id}/evaluate:
    post:
      operationId: evaluateCase
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-06
      summary: Ewaluacja sprawy i porównanie z decyzją ZUS (weryfikacja ubezpieczenia + kalkulator - wymóg § 4 i § 6 zadania)
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEvaluation'
        '404':
          description: Brak sprawy
          content: *id001
  /api/cases/upload:
    post:
      operationId: uploadCase
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-06
      summary: Upload wniosku (PDF) - rozpoznanie i mapowanie do modelu wejścia
      description: 'Plik nie jest zapisywany trwale ani logowany (poufność). Bez zgody M16e brak ekstrakcji AI: znane formularze → FIXTURE_MATCH,
        inne → MANUAL_REQUIRED.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentMediaType: application/pdf
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseUploadResult'
        '413':
          description: Plik za duży
          content: *id001
        '415':
          description: Nieobsługiwany typ pliku
          content: *id001
  /api/admin/parameters:
    get:
      operationId: listParameters
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-05
      summary: Parametry prawne (zus_rules meta.parameters + nadpisania)
      description: 'Demo: bez uwierzytelnienia (wejście bezpośrednio z przycisku „Panel admina”). Produkcyjnie: SSO.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterList'
    put:
      operationId: updateParameters
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-05
      summary: 'Nadpisanie parametrów z wersją i datą obowiązywania (wymóg: panel administracyjny)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterUpdate'
            example:
              base_parameters_version: 1
              changes:
              - name: MAT_RATE_COMBINED
                value: '0.815'
                valid_from: '2027-01-01'
                reason: Demo - zmiana stawki (docs/mentors.md M10)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterList'
        '409':
          description: Konflikt wersji parametrów
          content: *id001
        '422':
          description: Nieznany parametr lub zła wartość
          content: *id001
  /api/sim/mobywatel/login:
    post:
      operationId: simMobywatelLogin
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA logowania przez mObywatel (wybór profilu demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimLoginRequest'
            example:
              profile_id: employee_mother
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimLoginResponse'
        '404':
          description: Nieznany profil
          content: *id001
  /api/sim/zus-profile:
    get:
      operationId: simZusProfile
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA pobrania danych z systemów ZUS (ubezpieczenie, podstawa, płatnik)
      parameters:
      - &id002
        name: profile_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ProfileId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimZusProfile'
        '404':
          description: Nieznany profil
          content: *id001
  /api/sim/ezla:
    get:
      operationId: simEzla
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA podglądu zaświadczeń lekarskich e-ZLA
      parameters:
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimEzlaList'
        '404':
          description: Nieznany profil
          content: *id001
  /api/sim/debt-certificate:
    get:
      operationId: simDebtCertificate
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA zaświadczenia o stanie zadłużenia składkowego na dzień powstania prawa
      parameters:
      - *id002
      - name: as_of
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimDebtCertificate'
        '404':
          description: Nieznany profil
          content: *id001
  /api/sim/pue-question:
    post:
      operationId: simPueQuestion
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA zadania pytania przez PUE/eZUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimPueQuestion'
            example:
              profile_id: employee_mother
              topic: MATERNITY
              question: Czy muszę dostarczyć akt urodzenia?
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimPueTicket'
        '422':
          description: Niepoprawne dane
          content: *id001
  /api/sim/applications:
    post:
      operationId: simSubmitApplication
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA złożenia wniosku o urlop (do pracodawcy) lub o zasiłek (ZAM, do ZUS/płatnika)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimApplicationRequest'
            example:
              profile_id: employee_mother
              application_type: LEAVE_PARENTAL
              recipient: EMPLOYER
              planned_start: '2027-08-02'
              fields:
                weeks: 32
              attachments:
              - BIRTH_CERTIFICATE_SHORT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimApplicationResult'
        '422':
          description: Niepoprawne dane
          content: *id001
  /api/sim/birth-certificate:
    post:
      operationId: simBirthCertificate
      x-status: implemented
      x-owner: INT
      x-task: INT-03
      x-simulation: true
      summary: SYMULACJA wniosku o odpis aktu urodzenia (gov.pl - rejestr stanu cywilnego)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimBirthCertificateRequest'
            example:
              birth_date: '2027-03-15'
              copy_type: SHORT
              delivery: ELECTRONIC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimBirthCertificateResult'
        '422':
          description: Niepoprawne dane
          content: *id001
  /api/planner/suggest:
    post:
      operationId: plannerSuggest
      summary: Najlepszy następny wybór w planie urlopów obojga rodziców (+ cofanie o N kroków)
      description: 'Graf decyzji z 03_rules.yaml (kroki: wniosek 81,5%, przejęcie macierzyńskiego, ojcowski, 9 tygodni
        ojca, podział wspólnej części rodzicielskiego, praca na rodzicielskim). Dla bieżącego kroku (po `choices`)
        zwraca każdą opcję z najlepszym osiągalnym wynikiem, rekomendację, najlepszy plan oraz `backtrack` - lepsze
        wybory 1..`lookback` kroków wstecz. Kwoty deterministyczne (Decimal), bez LLM. Błędny wybór → status
        INVALID_CHOICE (HTTP 200) z regułą, która go wyklucza.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerSuggestRequest'
            examples:
              start:
                summary: Początek planu (dane syntetyczne)
                value:
                  profile:
                    children_count: 1
                    mother:
                      base_monthly: '6000.00'
                    father:
                      base_monthly: '9000.00'
                  choices: []
              after_split:
                summary: Po 5 krokach - z cofaniem o 2 kroki
                value:
                  profile:
                    mother:
                      base_monthly: '6000.00'
                    father:
                      base_monthly: '9000.00'
                  choices:
                  - true
                  - 0
                  - 2
                  - 9
                  - 0
                  objective: MAX_MONEY
                  lookback: 2
      responses:
        '200':
          description: Sugestia (także NEEDS_DATA / OUT_OF_SCOPE / INVALID_CHOICE - to nie są błędy HTTP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerSuggestResponse'
        '422':
          description: Niepoprawny format żądania
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-07
  /api/planner/graph:
    post:
      operationId: plannerGraph
      summary: Graf wszystkich opcji planu urlopów (węzły, krawędzie, opcje zablokowane regułami)
      description: 'Warstwowy DAG: węzeł = (krok, stan), krawędź = opcja z zyskiem `gain_exact`; opcje niedozwolone mają
        `feasible: false`, `to: null` i `blocked_by_rule`. `depth` ogranicza liczbę kroków (pełny graf: 7 - ok. 2 MB).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerGraphRequest'
            example:
              profile:
                mother:
                  base_monthly: '6000.00'
                father:
                  base_monthly: '9000.00'
              depth: 5
      responses:
        '200':
          description: Graf decyzji i najlepszy plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerGraphResponse'
        '422':
          description: Niepoprawny format żądania
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-status: implemented
      x-owner: BE-2
      x-task: BE2-07
components:
  schemas:
    Health:
      type: object
      required:
      - status
      - ruleset_version
      - law_reference_date
      - engine
      - app_version
      properties:
        status:
          const: ok
        app_version:
          type: string
          description: Wersja wdrożonej aplikacji z tagu vX.Y.Z (lokalnie dev).
        ruleset_version:
          type: string
        law_reference_date:
          type: string
          format: date
        engine:
          type: string
    Money:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?$
    Status:
      enum:
      - ELIGIBLE
      - NOT_ELIGIBLE
      - NEEDS_DATA
      - NEEDS_REVIEW
      - OUT_OF_SCOPE
    InsuranceTitle:
      type: object
      required:
      - title_type
      - sickness_insurance_mode
      - from
      properties:
        title_type:
          enum:
          - EMPLOYMENT_CONTRACT
          - CIVIL_CONTRACT_MANDATE
          - AGENCY_CONTRACT
          - SELF_EMPLOYED
          - SELF_EMPLOYED_COLLABORATOR
          - CLERGY
          - CLERGY_SELF_PAYER
          - SEAFARER_ART6_24
          - FOREIGN_EMPLOYER
          - OTHER
        sickness_insurance_mode:
          enum:
          - MANDATORY
          - VOLUNTARY
          - NONE
        from:
          type: string
          format: date
        to:
          type:
          - string
          - 'null'
          format: date
    EvaluateRequest:
      type: object
      description: Model wejścia = zus_rules/04_INPUT_DATA_SCHEMA.json (pełny). Kontrakt v1 wymaga tylko `event`; brak pozostałych pól
        silnik traktuje jako UNKNOWN → NEEDS_DATA. Docelowo 04 wymaga też `evaluation` i `person` - zaostrzenie tylko przez zmianę wersji
        kontraktu.
      required:
      - event
      properties:
        evaluation:
          type: object
          properties:
            as_of_date:
              $ref: '#/components/schemas/InDate'
              description: Data, wg której ocenia się obowiązywanie przepisów (domyślnie 2026-11-21).
              x-source: system
            mode:
              enum:
              - DECISION_SUPPORT
              - FORECAST
              description: FORECAST - zdarzenie przyszłe (planowany poród); wynik jest prognozą.
            ruleset_version:
              type: string
          x-required-in-04:
          - as_of_date
        person:
          type: object
          properties:
            role:
              enum:
              - MOTHER
              - FATHER
              - OTHER_FAMILY_MEMBER
              - ADOPTIVE_PARENT
              - FOSTER_PARENT
              x-source: user
            birth_date:
              $ref: '#/components/schemas/InDate'
              x-source: mObywatel(sym.)/user
              x-legal-basis: KP art. 92 § 1, § 5
              x-required-when: employee with incapacity (limit 33/14 dni)
            graduation_date:
              $ref: '#/components/schemas/InDate'
              x-legal-basis: USTAWA art. 4 ust. 3 pkt 1
              x-required-when: waiting period not met
            special_status:
              enum:
              - null
              - NONE
              - MP_SENATOR_WITHIN_90_DAYS
              - CUSTOMS_SERVICE_KAS
            has_pension_or_disability_pension:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 13 ust. 1 pkt 1; art. 18 ust. 7
            continues_or_started_gainful_activity:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 13 ust. 1 pkt 2
            receives_unemployment_or_preretirement_benefit:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 13 ust. 1 pkt 4
            mandatory_krus:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 13 ust. 1 pkt 5
            on_health_restoration_leave:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 18 ust. 7
          x-required-in-04:
          - role
        mother:
          type: object
          description: Dane matki, gdy oceniany jest ojciec / inny członek rodziny.
          properties:
            sickness_insured:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 29 ust. 9-10, 31 ust. 3h
            incapable_of_independent_living_certificate:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 29 ust. 5
            hospitalized_unable_to_care:
              $ref: '#/components/schemas/InTriBool'
            hospital_admission_date:
              $ref: '#/components/schemas/InDate'
            hospital_discharge_date:
              $ref: '#/components/schemas/InDate'
            death_date:
              $ref: '#/components/schemas/InDate'
            abandoned_child_date:
              $ref: '#/components/schemas/InDate'
            employment_start_date:
              $ref: '#/components/schemas/InDate'
            employment_fraction:
              $ref: '#/components/schemas/InFraction'
        insurance:
          type: object
          properties:
            titles:
              type: array
              items:
                $ref: '#/components/schemas/InInsuranceTitle'
              x-source: ZUS(sym.)/Z-3/Z-3a/poświadczenie
              description: Wszystkie tytuły ubezpieczenia chorobowego (bieżące i historyczne). Pusta lista + titles_confirmed_complete=true
                = brak ubezpieczenia.
            titles_confirmed_complete:
              type: boolean
              default: false
        employment:
          type: object
          properties:
            contract_type:
              enum:
              - null
              - INDEFINITE
              - FIXED_TERM
              - PROBATION_OVER_1_MONTH
              - PROBATION_UP_TO_1_MONTH
              - REPLACEMENT
            contract_end_date:
              $ref: '#/components/schemas/InDate'
            is_replacement_contract:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: KP art. 177 § 3(1)
            extended_until_birth_kp177:
              $ref: '#/components/schemas/InTriBool'
              description: Potwierdzenie przedłużenia do dnia porodu (np. ze świadectwa pracy). null → ocenia MAT-CLS-002 (BLOCKED).
            other_employment_provided:
              $ref: '#/components/schemas/InTriBool'
              x-legal-basis: USTAWA art. 30 ust. 3
            working_time_fraction:
